<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090b10" />
    <meta http-equiv="refresh" content="5;url=https://unhuddle.win" />
    <title>nice.unhuddle.win is closed</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #090b10;
        --panel: #121720;
        --line: #293241;
        --text: #f5f7fa;
        --muted: #9da7b5;
        --accent: #58d2c0;
      }

      * { box-sizing: border-box; }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
        overflow: hidden;
        color: var(--text);
        background: var(--bg);
        font-family: Georgia, "Times New Roman", serif;
      }

      body::before {
        position: fixed;
        inset: 0;
        z-index: -1;
        content: "";
        background:
          radial-gradient(circle at 18% 12%, rgba(88, 210, 192, 0.18), transparent 32%),
          radial-gradient(circle at 86% 80%, rgba(82, 117, 255, 0.13), transparent 34%);
      }

      main {
        width: min(560px, 100%);
        padding: clamp(34px, 8vw, 72px) clamp(24px, 8vw, 68px);
        border: 1px solid var(--line);
        background: rgba(18, 23, 32, 0.88);
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
        text-align: center;
        animation: appear 0.6s ease both;
      }

      .mark {
        display: grid;
        width: 48px;
        height: 48px;
        margin: 0 auto 28px;
        place-items: center;
        border: 1px solid rgba(88, 210, 192, 0.48);
        border-radius: 50%;
        color: var(--accent);
        font: 700 20px Georgia, serif;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 52px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        margin: 18px auto 0;
        max-width: 390px;
        color: var(--muted);
        font: 15px/1.65 Arial, sans-serif;
      }

      .countdown {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 18px;
        border: 1px solid rgba(88, 210, 192, 0.38);
        color: var(--accent);
        font: 700 13px Arial, sans-serif;
      }

      a {
        display: inline-block;
        margin-top: 24px;
        color: var(--text);
        font: 700 13px Arial, sans-serif;
        text-underline-offset: 4px;
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">x</div>
      <h1>nice.unhuddle.win is closed</h1>
      <p>This page has moved. You will be redirected to unhuddle.win shortly.</p>
      <div class="countdown" aria-live="polite">
        Redirecting in <span id="seconds">5</span> seconds
      </div>
      <br />
      <a href="https://unhuddle.win">Go to unhuddle.win now</a>
    </main>
    <script>
      const seconds = document.querySelector("#seconds");
      let remaining = 5;
      const timer = setInterval(() => {
        remaining -= 1;
        seconds.textContent = remaining;
        if (remaining <= 0) {
          clearInterval(timer);
          window.location.replace("https://unhuddle.win");
        }
      }, 1000);
    </script>
  </body>
</html>
